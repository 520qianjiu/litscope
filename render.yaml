services:
  - type: web
    name: litscope
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/serve.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: EMBEDDING_PROVIDER
        value: hashing
      - key: DEEPSEEK_API_KEY
        sync: false
